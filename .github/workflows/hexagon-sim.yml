name: hexagon-sim
on: [push, pull_request]
env:
  SDK_VERSION: "6.6.0.0"
jobs:
  sim:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build unzip wget libncurses5
      - uses: actions/cache@v4
        id: sdk
        with: 
          path: Hexagon_SDK
          key: hexagon-sdk-${{ env.SDK_VERSION }}
      - if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          wget -nv -O sdk.tar.xz "https://github.com/snapdragon-toolchain/hexagon-sdk/releases/download/v$SDK_VERSION/hexagon-sdk-v$SDK_VERSION-amd64-lnx.tar.xz"
          mkdir -p Hexagon_SDK && tar -xJf sdk.tar.xz -C Hexagon_SDK && rm sdk.tar.xz
          ls Hexagon_SDK
      - run: echo "HEXAGON_SDK_ROOT=$PWD/Hexagon_SDK/$SDK_VERSION" >> $GITHUB_ENV
      - name: Rust nightly
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build Rust HVX kernel
        working-directory: rust-kernel
        run: cargo +nightly build --release
      - run: cmake -S sim -B build-sim -G Ninja
      - run: cmake --build build-sim
      - run: ctest --test-dir build-sim --output-on-failure